name: Build Workers KV snapshots

# 每小時預先計算首頁統計、收錄覆蓋率（pack-prizes、series-hits、catalog/coverage）與 Sitemaps（sitemap.xml、series.xml、cards-N.xml）並透過 Cloudflare API 寫入 Workers KV（SNAPSHOT_KV）。
# 每日 24 次 × 約 7 個鍵 ≈ 168 次 KV 寫入（僅占 Cloudflare Workers KV 免費方案每日 1,000 次寫入額度的 16.8%）。
# 需於 GitHub Repository Settings → Secrets and variables → Actions 設定以下 Secrets（僅列名稱，嚴禁將值寫入此檔案）：
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
# - SUPABASE2_URL
# - SUPABASE2_SERVICE_KEY
# - CF_ACCOUNT_ID
# - CF_KV_NAMESPACE_ID
# - CF_API_TOKEN
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: '要產生的快照目標（逗號分隔：pack-prizes,series-hits,catalog-coverage,sitemaps）'
        required: false
        default: 'pack-prizes,series-hits,catalog-coverage,sitemaps'

permissions:
  contents: read

jobs:
  build-and-push-kv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compute and push KV snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE2_URL: ${{ secrets.SUPABASE2_URL }}
          SUPABASE2_SERVICE_KEY: ${{ secrets.SUPABASE2_SERVICE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SNAPSHOT_TARGETS: ${{ github.event.inputs.targets || 'pack-prizes,series-hits,catalog-coverage,sitemaps' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            node scripts/build-kv-snapshots.mjs --push --if-configured --targets "$SNAPSHOT_TARGETS"
          else
            node scripts/build-kv-snapshots.mjs --push --targets "$SNAPSHOT_TARGETS"
          fi
