name = "cardseek"
main = "worker/index.mjs"
compatibility_date = "2026-11-01"

# 正式網域路由綁定（2026-11-23 已啟用；必須在任何 [section] 之前，否則會被當成 vars）：
routes = [
  { pattern = "cardseektcg.com/*", zone_name = "cardseektcg.com" },
  { pattern = "www.cardseektcg.com/*", zone_name = "cardseektcg.com" }
]

[build]
command = "node scripts/prepare-worker-assets.mjs"

[assets]
directory = "./worker/public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = [
  "/",
  "/index.html",
  "/api/*",
  "/sitemap.xml",
  "/sitemaps/*",
  "/robots.txt",
  "/.well-known/*"
]

[vars]
ORIGIN_URL = "https://cardscope.onrender.com"
PUBLIC_BASE_URL = "https://cardseektcg.com"
# 讀取端點開關（預設全部搬遷）：可用 "none" 全數退回 Render，或 "-cards,-search" 單支切回代理。
# MIGRATED_API = "all"
# 可選非機密調整：
# SUPABASE2_TIMEOUT_MS = "4000"
# JPY_TO_TWD = "0.22"
# USD_TO_TWD = "32"

# 部署前需以 `wrangler secret put <NAME>` 設定的機密環境變數名稱（嚴禁寫入設定值）：
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
# - SUPABASE2_URL
# - SUPABASE2_SERVICE_KEY
# - ORIGIN_VERIFY_SECRET
# - SCRAPE_SECRET（選用：僅用於 /api/providers 顯示 yuyutei.enabled 旗標）
