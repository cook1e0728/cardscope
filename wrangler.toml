name = "cardseek"
main = "worker/index.mjs"
compatibility_date = "2026-11-01"

# 正式網域路由綁定（2026-11-23 已啟用；必須在任何 [section] 之前，否則會被當成 vars）：
routes = [
  { pattern = "cardseektcg.com/*", zone_name = "cardseektcg.com" },
  { pattern = "www.cardseektcg.com/*", zone_name = "cardseektcg.com" }
]

[build]
command = "node scripts/prepare-worker-assets.mjs"

[assets]
directory = "./worker/public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = [
  "/",
  "/index.html",
  "/api/*",
  "/sitemap.xml",
  "/sitemaps/*",
  "/robots.txt",
  "/.well-known/*"
]

[vars]
ORIGIN_URL = "https://cardscope.onrender.com"
PUBLIC_BASE_URL = "https://cardseektcg.com"
