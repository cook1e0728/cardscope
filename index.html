<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardScope｜TCG 卡牌圖鑑</title><style>
:root{--y:#ffe500;--ink:#171717;--muted:#777;--line:#e5e5e5;--soft:#f3f4f5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,"Noto Sans TC",sans-serif}button,input{font:inherit}.wrap{max-width:1500px;margin:auto;padding:0 22px}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.bar{height:66px;display:flex;align-items:center;gap:25px}.brand{font-size:24px;font-weight:950}.brand i{color:#00a99a;font-style:normal}.nav{display:flex;gap:24px;margin:auto}.nav b{padding:21px 3px 17px;border-bottom:4px solid transparent}.nav .on{border-color:var(--y)}.search{display:flex;flex:1;max-width:780px;border:2px solid #111;border-radius:26px;overflow:hidden}.search input{border:0;outline:0;flex:1;padding:10px 17px}.search button{width:58px;border:0;background:#111;color:#fff;font-size:21px}.hero{padding:22px 0 0}.hero h1{font-size:26px;margin:0}.meta{color:var(--muted);font-size:13px}.channels,.rail{display:flex;gap:16px;overflow-x:auto;padding:14px 2px 19px}.channel{border:0;background:none;min-width:125px;cursor:pointer}.channel-art{height:104px;border-radius:19px;background:linear-gradient(135deg,#ffe76b,#71d9d0);overflow:hidden;border:3px solid transparent}.channel-art img,.series-art img,.art img,.detail-art img{width:100%;height:100%;object-fit:contain}.channel.on .channel-art{border-color:#111;box-shadow:0 0 0 3px var(--y)}.channel b{display:block;margin-top:7px}.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:none;padding:12px 2px;font-weight:800;white-space:nowrap}.tab.on{border-bottom:4px solid var(--y)}.section{padding:20px 0}.title{display:flex;justify-content:space-between;align-items:end}.section h2{font-size:20px;margin:0}.series-card{min-width:165px;width:165px;cursor:pointer}.series-art{height:120px;border-radius:14px;background:var(--soft);overflow:hidden;display:grid;place-items:center}.series-card h3,.card h3{font-size:15px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;background:#eee;border-radius:5px;padding:2px 6px;font-size:11px;margin:3px 4px 0 0}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 14px}.card{cursor:pointer;min-width:0}.art{aspect-ratio:5/7;border-radius:12px;background:var(--soft);overflow:hidden;display:grid;place-items:center;text-align:center;padding:4px}.notice{display:none;margin:14px 0;padding:15px;border:1px solid #dfcf52;background:#fffde1;border-radius:12px}.status{margin:25px 0 95px;padding:13px 17px;background:var(--soft);border-radius:12px}.modal{position:fixed;inset:0;background:#111b;z-index:10;display:none;padding:24px;overflow:auto}.modal.open{display:grid;place-items:center}.dialog{max-width:920px;width:100%;background:#fff;border-radius:20px;padding:25px;position:relative}.close{position:absolute;right:14px;top:12px;border:0;width:36px;height:36px;border-radius:50%;font-size:22px}.detail{display:grid;grid-template-columns:260px 1fr;gap:28px}.detail-art{aspect-ratio:5/7;background:var(--soft);border-radius:13px;overflow:hidden}.state,.market{background:var(--soft);padding:11px;margin:8px 0;border-radius:8px}.bottom{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.wrap{padding:0 12px}.bar{height:auto;flex-wrap:wrap;padding:10px 0;gap:8px}.nav{display:none}.search{order:3;flex-basis:100%;max-width:none}.channel{min-width:92px}.channel-art{height:78px}.cards{grid-template-columns:repeat(2,1fr);gap:18px 10px}.detail{grid-template-columns:1fr}.detail-art{max-width:260px;margin:auto;width:100%}.bottom{position:fixed;display:flex;z-index:6;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center}.bottom button{border:0;background:none;font-size:12px}.bottom b{display:block;font-size:20px}.bottom .plus{width:52px;height:52px;border-radius:50%;background:var(--y);font-size:28px;margin-top:-24px}}
</style></head><body><header class="top"><div class="wrap bar"><div class="brand">Card<i>Scope</i></div><nav class="nav"><b>追蹤</b><b class="on">探索</b><b>圖鑑</b></nav><div class="search"><input id="q" placeholder="卡名／編號／系列，例如：噴火龍、魯夫、OP-05"><button id="go">⌕</button></div></div></header>
<main class="wrap"><section class="hero"><h1>探索 TCG 卡牌</h1><div class="meta">公開圖鑑資料 · 圖片與價格來源清楚標示</div><div class="channels" id="channels"></div><div class="tabs"><button class="tab on">最新收錄</button><button class="tab" onclick="document.querySelector('#series').scrollIntoView()">卡盒系列</button><button class="tab" onclick="document.querySelector('#cards').scrollIntoView()">完整圖鑑</button><button class="tab" onclick="marketInfo()">市場資料</button></div></section><div class="notice" id="notice"></div>
<section class="section"><div class="title"><h2>卡盒／系列</h2><span class="meta">左右滑動查看更多</span></div><div class="rail" id="series"></div></section><section class="section"><div class="title"><div><h2 id="cardsTitle">最新卡片</h2><span class="meta">不是熱銷排行；沒有可靠交易量時不顯示排名</span></div></div><div class="cards" id="cards"></div></section><div class="status meta" id="status">Catalog 載入中…</div></main>
<nav class="bottom"><button><b>⌕</b>探索</button><button><b>▣</b>卡片</button><button class="plus">＋</button><button><b>◌</b>資料</button><button><b>♙</b>我的</button></nav><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="detail"></div></div></div>
<script>
let C={games:[],series:[],cards:[]},P=[],game='all';const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),G=id=>C.games.find(x=>x.id===id)||{},rn=r=>({TW:'台版',JP:'日版',US:'美版',KR:'韓版',ASIA:'亞洲英文版'}[r]||r||'版本待補'),ln=l=>String(l||'').startsWith('zh')?'繁體中文':String(l||'').startsWith('ja')?'日文':String(l||'').startsWith('ko')?'韓文':String(l||'').startsWith('en')?'英文':l||'語言待補',original=c=>c.nameJa||c.nameEn||c.nameKo||c.name||'',image=c=>c.imageUrl||c.printings?.find(p=>p.imageUrl&&!p.imageRehostRequired)?.imageUrl,name=c=>c.nameZh||`中文名稱待補｜${original(c)||'原名待補'}`,art=c=>image(c)?`<img src="${e(image(c))}" alt="${e(name(c))}" loading="lazy" onerror="this.remove()">`:e(name(c));
function channels(){let ds=[['all','全部遊戲'],['pokemon','寶可夢'],['onepiece','航海王'],['yugioh','遊戲王']];$('channels').innerHTML=ds.map(d=>{let p=P.find(x=>x.game===d[0]&&x.imageUrl),c=C.cards.find(x=>d[0]==='all'||x.game===d[0]);return`<button class="channel ${game===d[0]?'on':''}" onclick="choose('${d[0]}')"><div class="channel-art">${p?`<img src="${e(p.imageUrl)}">`:c?art(c):'TCG'}</div><b>${d[1]}</b></button>`}).join('')}
function series(){let rows=P.filter(x=>game==='all'||x.game===game).slice(0,18);$('series').innerHTML=rows.map(s=>`<article class="series-card" onclick="seriesSearch('${e(s.officialCode||s.name)}')"><div class="series-art">${s.imageUrl?`<img src="${e(s.imageUrl)}" loading="lazy">`:'系列'}</div><h3>${e(name(s))}</h3><div class="meta">${e(s.officialCode||'系列代碼待補')} · <span class="badge">${e(s.versionLabel||rn(s.region))}</span></div></article>`).join('')}
function cards(rows){$('cards').innerHTML=rows.length?rows.map(c=>`<article class="card" onclick="openCard('${e(c.id)}')"><div class="art">${art(c)}</div><h3>${e(name(c))}</h3><div class="meta">${e(c.officialCardNumber||c.printings?.[0]?.localCardNumber)} · ${e(c.rarity||'稀有度待補')}</div><span class="badge">${e(rn(c.region||c.printings?.[0]?.region))}</span></article>`).join(''):'<p>目前沒有符合條件的卡片。</p>'}
function render(){channels();series();cards(C.cards.filter(c=>game==='all'||c.game===game).slice(0,24));$('cardsTitle').textContent=game==='all'?'最新卡片':(G(game).nameZh||game)+'卡片'}window.choose=id=>{game=id;render()};window.seriesSearch=q=>{$('q').value=q;search()};window.marketInfo=()=>{let b=$('notice');b.style.display='block';b.textContent='市場資料在卡片詳細頁中顯示，買取、掛牌與參考價會分開標示。'};
async function search(){let q=$('q').value.trim(),b=$('notice');if(!q)return;b.style.display='block';b.textContent='正在搜尋完整圖鑑…';try{let r=await fetch('/api/search?q='+encodeURIComponent(q)+'&region=all'),x=await r.json();if(!r.ok)throw Error(x.error);cards(x.data||[]);$('cardsTitle').textContent=`「${q}」的搜尋結果（${x.data?.length||0}）`;b.textContent=x.data?.length?'卡圖語言不影響繁中主名稱；不同版本會合併整理。':'找不到結果；不以示範卡片填補。';$('cards').scrollIntoView({behavior:'smooth'})}catch(x){b.textContent='搜尋失敗：'+x.message}}
async function openCard(id){$('modal').classList.add('open');$('detail').textContent='正在載入…';try{let[cr,mr]=await Promise.all([fetch('/api/cards/'+encodeURIComponent(id)),fetch('/api/cards/'+encodeURIComponent(id)+'/market')]),cb=await cr.json(),mb=await mr.json(),c=cb.data,m=mb.data||{records:[],meta:{}};if(!cr.ok)throw Error(cb.error);let versions=(c.printings||[]).map(p=>`<div class="state"><b>${e(rn(p.region))}</b> · ${e(ln(p.language))} · ${e(p.localSetCode)} · ${e(p.localCardNumber)}</div>`).join('');$('detail').innerHTML=`<div class="detail"><div class="detail-art">${art(c)}</div><div><h2>${e(name(c))}</h2><p class="meta">${original(c)?'原名：'+e(original(c)):''}</p><p>${e(c.game?.nameZh)}｜${e(c.officialCardNumber)}｜${e(c.rarity||'稀有度待補')}</p><h3>收錄版本</h3>${versions||'<div class="state">版本待補</div>'}<h3>市場資料</h3><p class="meta">${e(m.meta?.warning||'不同價格性質不混算。')}</p>${m.records?.length?m.records.map(r=>`<div class="market"><b>${e(r.provider)}</b> · ${e(r.priceType)} · ${e(r.currency)} ${Number(r.amount).toLocaleString()}</div>`).join(''):'<div class="state">目前沒有可靠對應價格，不以假價格補空白。</div>'}</div></div>`}catch(x){$('detail').textContent='載入失敗：'+x.message}}window.openCard=openCard;
async function init(){try{let[a,b,c]=await Promise.all([fetch('/api/catalog',{cache:'no-store'}),fetch('/api/products'),fetch('/api/catalog/coverage')]),ca=await a.json(),pb=await b.json(),cv=await c.json();C=ca.data;P=pb.data||[];$('status').textContent=`公開來源已同步 ${Number(cv.data?.totalCards||C.cards.length).toLocaleString()} 張卡片、${P.length.toLocaleString()} 個卡盒／系列。首頁是精簡預覽，搜尋會查完整資料庫。`;render()}catch(x){$('status').textContent='載入失敗：'+x.message}}$('go').onclick=search;$('q').onkeydown=x=>{if(x.key==='Enter')search()};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=x=>{if(x.target.id==='modal')$('modal').classList.remove('open')};init();
</script></body></html>
