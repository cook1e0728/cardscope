<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardScope｜TCG 卡牌資料庫與市場</title><style>
:root{--ink:#17202b;--muted:#667085;--line:#e3e7ed;--nav:#102033;--blue:#215de4;--bg:#f7f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}.shell{max-width:1120px;margin:auto;padding:0 24px}.top{background:var(--nav);color:#fff}.nav{height:68px;display:flex;align-items:center}.logo{font-size:22px;font-weight:850}.logo b{color:#65dfd0}.hero{padding:44px 0 28px}.hero h1{font-size:38px;line-height:1.15;margin:5px 0}.meta{color:var(--muted);font-size:13px}.search{margin:24px 0 12px;background:#fff;border:1px solid #c9d0da;border-radius:13px;display:flex;overflow:hidden}.search input{border:0;outline:0;padding:17px;flex:1;font-size:16px}.search button{margin:7px;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 24px}.filters{display:flex;gap:8px}.pill{border:1px solid #d2d8e1;background:#fff;border-radius:999px;padding:7px 13px}.pill.active{background:var(--nav);color:#fff}.notice{display:none;padding:16px;background:#f5f8ff;border:1px solid #cfd9ed;border-radius:10px}.section{margin:28px 0}.cards,.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile,.panel,.set-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.tile,.set-card,.result,.series-row{cursor:pointer}.art{aspect-ratio:5/7;background:#e9eef8;border-radius:9px;display:grid;place-items:center;text-align:center;overflow:hidden}.art img,.thumb img,.detail-image img{width:100%;height:100%;object-fit:contain}.catalog{display:grid;grid-template-columns:240px 1fr;gap:16px}.game-list button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px}.game-list button.active{background:#edf3ff;color:#174fc2;font-weight:700}.series-row,.result,.market-row{border-top:1px solid var(--line);padding:12px 0}.series-row{display:grid;grid-template-columns:95px 1fr 75px;gap:10px}.result{display:grid;grid-template-columns:70px 1fr auto;gap:14px}.thumb{width:70px;height:98px;background:#e9eef8;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11px;overflow:hidden}.badge{display:inline-block;background:#eef2f7;border-radius:5px;padding:2px 6px;margin:4px 4px 0 0;font-size:11px}.modal{position:fixed;inset:0;background:#0b1526cc;display:none;z-index:5;padding:22px;overflow:auto}.modal.open{display:grid;place-items:center}.dialog{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:24px;position:relative}.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;font-size:22px}.detail{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail-image{aspect-ratio:5/7;background:#e9eef8;border-radius:10px;display:grid;place-items:center;overflow:hidden}.market-row{display:grid;grid-template-columns:100px 120px 1fr auto;gap:8px}.state{background:#f6f7f9;padding:9px;margin:7px 0;border-radius:7px}@media(max-width:760px){.cards,.sets{grid-template-columns:1fr 1fr}.catalog,.detail{grid-template-columns:1fr}.market-row{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards,.sets{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><header class="top"><div class="shell nav"><div class="logo">Card<b>Scope</b></div></div></header><main class="shell"><section class="hero"><div class="meta">TCG DATABASE & MARKET INTELLIGENCE</div><h1>從一個名字，找到每一個版本與市場價格</h1><p class="meta">搜尋多語卡名、卡號或系列；掛牌、買取、參考價與成交會分開標示。</p><div class="search"><input id="q" placeholder="夢幻、Mew、ミュウ、347/190、SV4a、OP-05…"><button id="go">搜尋</button></div><div class="filters" id="regions"><button class="pill active" data-v="all">全部</button><button class="pill" data-v="TW">台版</button><button class="pill" data-v="JP">日版</button><button class="pill" data-v="US">美版</button></div></section><div class="notice" id="notice"></div><section class="section"><h2>已收錄卡片</h2><p class="meta">此區不是熱門榜；在有真實活動資料前，不顯示假排名或假交易量。</p><div class="cards" id="cards"></div></section><section class="section"><h2>最新系列</h2><div class="sets" id="sets"></div></section><section class="section"><h2>卡盒／補充包系列</h2><p class="meta">來源：Pokémon TCG API、YGOPRODeck、ONE PIECE 官方產品頁；不是銷量或庫存。</p><div class="sets" id="products"><p class="meta">卡盒資料載入中…</p></div></section><section class="section"><h2>卡片資料庫</h2><div class="catalog"><aside class="panel game-list" id="games"></aside><div class="panel"><h3 id="catalogTitle"></h3><div id="series"></div></div></div></section><p class="meta" id="status">Catalog 載入中；沒有可靠資料時不以示範數字代替。</p></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="detail"></div></div></div><script>
let C={games:[],series:[],cards:[]},region='all',game='pokemon';const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),n=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/[\s・·._:：'’"-]/g,''),S=id=>C.series.find(x=>x.id===id)||{},G=id=>C.games.find(x=>x.id===id)||{},rn=r=>({TW:'台版',JP:'日版',US:'美版',KR:'韓版',CN:'中國版',ASIA:'亞洲英文版',EU:'歐版'}[r]||r||'版本待補'),printingLabels=c=>[...new Set((c.printings?.length?c.printings:[c]).map(p=>rn(p.region)))],art=c=>{let image=c.imageUrl||c.printings?.find(p=>p.imageUrl)?.imageUrl,fallback=`${e(c.nameEn||c.nameZh)}<br>${e(c.officialCardNumber||c.printings?.[0]?.localCardNumber)}`;return image?`<img src="${e(image)}" alt="${e(c.nameZh||c.nameEn)}" loading="lazy" onerror="this.parentElement.innerHTML='${fallback}'">`:fallback};
function nameTerms(c){return[c.nameZh,c.nameJa,c.nameEn,c.nameKo,...(c.aliases||[]),...(c.printings||[]).flatMap(p=>[p.nameZh,p.nameJa,p.nameEn,p.nameKo])].map(n)}function searchable(c){let series=[S(c.seriesId),...(c.printings||[]).map(p=>S(p.seriesId))];return[...nameTerms(c),n(c.officialCardNumber),...(c.printings||[]).flatMap(p=>[p.localSetCode,p.localCardNumber]).map(n),...series.flatMap(s=>[s.officialCode,s.nameZh,s.nameJa,s.nameEn,s.nameKo,...(s.aliases||[])]).map(n)]}function matches(q,allRegions=false){let needle=n(q),found=C.cards.filter(c=>(allRegions||region==='all'||c.region===region||c.printings?.some(p=>p.region===region))&&searchable(c).some(x=>x.includes(needle))),exact=found.filter(c=>nameTerms(c).some(x=>x===needle));return exact.length?exact:found}
function rows(a){return a.map(c=>`<div class="result" onclick="openCard('${e(c.id)}')"><div class="thumb">${art(c)}</div><div><b>${e(c.nameZh||'—')} · ${e(c.nameEn||'—')}</b><div class="meta">${e(G(c.game).nameZh)} · ${e(S(c.seriesId).officialCode)} · ${e(c.officialCardNumber)}</div>${printingLabels(c).map(x=>`<span class="badge">${e(x)}</span>`).join('')}<span class="badge">${e(c.rarity||'稀有度待補')}</span></div><b>詳細與行情 →</b></div>`).join('')}
async function search(){let q=document.getElementById('q').value.trim(),box=document.getElementById('notice');if(!q)return;box.style.display='block';let a=matches(q);if(a.length){box.innerHTML=`<b>找到 ${a.length} 張</b>${rows(a)}`;return}let other=matches(q,true);if(other.length){box.innerHTML=`<b>目前版本沒有結果；以下是其他版本找到的 ${other.length} 張</b><p class="meta">可切換到「全部」查看完整結果。</p>${rows(other)}`;return}box.textContent='正在查詢免費外部卡牌圖鑑…';try{let r=await fetch(`/api/search/external?q=${encodeURIComponent(q)}`),b=await r.json();if(r.ok&&b.data?.length){box.innerHTML=`<b>Catalog 尚未收錄，外部圖鑑找到 ${b.data.length} 筆結果</b><p class="meta">${e(b.meta?.warning)} 搜尋詞已對應為「${e(b.meta?.resolvedQuery||q)}」。</p>${b.data.map(c=>{let v=c.variants?.[0],set=c.set||c.sets?.[0]?.setName||'系列待補',number=c.number||c.sets?.[0]?.setCode||'',picture=c.imageUrl?`<img src="${e(c.imageUrl)}" alt="${e(c.name)}" loading="lazy">`:e(c.game||'TCG');return`<div class="result"><div class="thumb">${picture}</div><div><b>${e(c.name)}</b><div class="meta">${e(set)} · ${e(number)} · ${e(c.rarity||'稀有度依版本')}</div>${v?.amount?`<span class="badge">${e(v.condition||'')} ${e(v.printing||'')} · USD ${Number(v.amount).toLocaleString()} 市場參考價</span>`:''}</div><span>外部資料</span></div>`}).join('')}`;return}}catch{}box.innerHTML=`找不到「<b>${e(q)}</b>」；Catalog 與目前可用的免費外部來源都沒有結果。`}
async function openCard(id){let modal=document.getElementById('modal'),d=document.getElementById('detail');modal.classList.add('open');d.textContent='正在載入卡片與來源行情…';try{let[cr,mr]=await Promise.all([fetch(`/api/cards/${encodeURIComponent(id)}`),fetch(`/api/cards/${encodeURIComponent(id)}/market`)]),cb=await cr.json(),mb=await mr.json();if(!cr.ok)throw Error(cb.error);let c=cb.data,m=mb.data||{records:[],sources:[],meta:{}},labels=m.meta?.priceTypes||{},versions=(c.printings||[]).map(p=>`<div class="state"><b>${e(rn(p.region))}</b> · ${e(p.language||'語言待補')} · ${e(p.localSetCode||S(p.seriesId).officialCode||'系列待補')} · ${e(p.localCardNumber||'卡號待補')}</div>`).join('');d.innerHTML=`<div class="detail"><div class="detail-image">${art(c)}</div><div><h2>${e(c.nameZh||c.nameEn)}</h2><p class="meta">${e(c.nameJa||'')} · ${e(c.nameEn||'')}${c.nameKo?' · '+e(c.nameKo):''}</p><p>${e(c.game?.nameZh)}｜${e(c.series?.officialCode)}｜${e(c.officialCardNumber)}｜${e(c.rarity||'稀有度待補')}</p><h3>收錄版本</h3>${versions||'<div class="state">版本資料待補。</div>'}<h3>市場資料</h3><p class="meta">${e(m.meta?.warning)}</p>${m.records.length?m.records.map(r=>`<div class="market-row"><b>${e(r.provider)}</b><span class="badge">${e(labels[r.priceType]||r.priceType)}</span><span>${e(r.currency)} ${Number(r.amount).toLocaleString()}</span><b>${r.priceTwd==null?'未換算':'約 NT$ '+Number(r.priceTwd).toLocaleString()}</b></div>`).join(''):'<div class="state">目前沒有能可靠對應此版本的價格；不以假價格補空白。</div>'}<h3>來源狀態</h3>${m.sources.map(s=>`<div class="state"><b>${e(s.source)}</b>：${s.status==='ok'?'已查詢':'目前不可用'}${s.notice?' · '+e(s.notice):''}</div>`).join('')||'<div class="state">沒有已設定的來源。</div>'}</div></div>`}catch(x){d.textContent='載入失敗：'+x.message}}window.openCard=openCard;
function render(){document.getElementById('cards').innerHTML=C.cards.slice(0,6).map(c=>`<article class="tile" onclick="openCard('${e(c.id)}')"><div class="art">${art(c)}</div><h3>${e(c.nameZh)} · ${e(c.nameEn)}</h3><p class="meta">${e(c.officialCardNumber)} · ${printingLabels(c).map(e).join('／')}</p></article>`).join('');document.getElementById('sets').innerHTML=[...C.series].sort((a,b)=>String(b.releaseDate).localeCompare(String(a.releaseDate))).slice(0,3).map(s=>`<article class="set-card" onclick="openSeries('${e(s.id)}')"><b>${e(s.officialCode)}</b><span class="badge">${e(rn(s.region))}</span><h3>${e(s.nameZh||s.nameEn)}</h3><p class="meta">${e(s.nameJa||s.nameEn||'')} · ${e(s.releaseDate||'發售日待補')}</p></article>`).join('');document.getElementById('games').innerHTML=C.games.map(g=>`<button class="${g.id===game?'active':''}" onclick="chooseGame('${e(g.id)}')">${e(g.nameZh)} ${e(g.nameEn)}</button>`).join('');document.getElementById('catalogTitle').textContent=(G(game).nameZh||'')+' · 系列索引';document.getElementById('series').innerHTML=C.series.filter(s=>s.game===game).map(s=>`<div class="series-row" onclick="openSeries('${e(s.id)}')"><b>${e(s.officialCode)}</b><span>${e(s.nameZh||s.nameEn)} <span class="badge">${e(rn(s.region))}</span><br><span class="meta">${e(s.nameJa||s.nameEn)}</span></span><span>${C.cards.filter(c=>c.seriesId===s.id||c.printings?.some(p=>p.seriesId===s.id)).length} 張 →</span></div>`).join('')||'<p class="meta">尚無系列資料。</p>'}window.chooseGame=id=>{game=id;render()};window.openSeries=id=>{document.getElementById('q').value=S(id).officialCode;search();scrollTo({top:140,behavior:'smooth'})};
async function loadProducts(){let box=document.getElementById('products');try{let r=await fetch('/api/products'),b=await r.json(),items=b.data||[],allowedImageKinds=new Set(['series-logo','sealed-product','product']),shown=['pokemon','onepiece','yugioh'].flatMap(g=>items.filter(p=>p.game===g).sort((a,b)=>Number(Boolean(b.nameZh))-Number(Boolean(a.nameZh))||String(b.releaseDate||'').localeCompare(String(a.releaseDate||''))).slice(0,6));box.innerHTML=shown.map(p=>`<article class="set-card">${p.imageUrl&&allowedImageKinds.has(p.imageKind)?`<div class="art"><img src="${e(p.imageUrl)}" alt="${e(p.nameZh||p.name)}" loading="lazy"></div>`:''}<span class="badge">${e(G(p.game).nameZh||p.game)}</span><span class="badge">${e(p.versionLabel||rn(p.region))}</span><h3>${e(p.nameZh||p.name)}</h3>${p.nameZh&&p.name?`<p class="meta">${e(p.nameJa||p.name)}</p>`:''}<p class="meta">${e(p.releaseDate?String(p.releaseDate).slice(0,10):'發售日待補')}${p.cardsCount!=null?' · '+Number(p.cardsCount).toLocaleString()+' 張卡':''}</p><b>${e(p.productType||'系列／產品')}</b></article>`).join('')||'<p class="meta">目前來源沒有卡盒資料。</p>'}catch{box.innerHTML='<p class="meta">卡盒資料暫時無法載入。</p>'}}
async function init(){loadProducts();try{let r=await fetch('/api/catalog',{cache:'no-store'}),b=await r.json();C=b.data;document.getElementById('status').textContent=`Catalog 來源：${String(C.source).startsWith('supabase')?'Supabase＋公開備援':'catalog.json 備援'}；${C.cards.length} 張 canonical 卡片、${C.cards.reduce((sum,c)=>sum+(c.printings?.length||1),0)} 個版本、${C.series.length} 個系列。沒有可靠資料時不以示範數字代替。`;render()}catch{document.getElementById('status').textContent='Catalog 載入失敗。'}}document.getElementById('go').onclick=search;document.getElementById('q').onkeydown=x=>{if(x.key==='Enter')search()};document.querySelectorAll('#regions button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#regions button').forEach(x=>x.classList.remove('active'));b.classList.add('active');region=b.dataset.v;search()});document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=x=>{if(x.target.id==='modal')x.currentTarget.classList.remove('open')};init();
</script></body></html>
