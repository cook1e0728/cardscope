<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardScope｜TCG 卡牌資料庫與市場</title><style>
:root{--ink:#17202b;--muted:#667085;--line:#e3e7ed;--nav:#102033;--blue:#215de4;--bg:#f7f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}.shell{max-width:1120px;margin:auto;padding:0 24px}.top{background:var(--nav);color:#fff}.nav{height:68px;display:flex;align-items:center}.logo{font-size:22px;font-weight:850}.logo b{color:#65dfd0}.hero{padding:44px 0 28px}.hero h1{font-size:38px;line-height:1.15;margin:5px 0}.meta{color:var(--muted);font-size:13px}.search{margin:24px 0 12px;background:#fff;border:1px solid #c9d0da;border-radius:13px;display:flex;overflow:hidden}.search input{border:0;outline:0;padding:17px;flex:1;font-size:16px}.search button{margin:7px;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 24px}.filters{display:flex;gap:8px}.pill{border:1px solid #d2d8e1;background:#fff;border-radius:999px;padding:7px 13px}.pill.active{background:var(--nav);color:#fff}.notice{display:none;padding:16px;background:#f5f8ff;border:1px solid #cfd9ed;border-radius:10px}.section{margin:28px 0}.cards,.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile,.panel,.set-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.tile,.set-card,.result,.series-row{cursor:pointer}.art{aspect-ratio:5/7;background:#e9eef8;border-radius:9px;display:grid;place-items:center;text-align:center;overflow:hidden}.art img,.thumb img,.detail-image img{width:100%;height:100%;object-fit:contain}.catalog{display:grid;grid-template-columns:240px 1fr;gap:16px}.game-list button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px}.game-list button.active{background:#edf3ff;color:#174fc2;font-weight:700}.series-row,.result,.market-row{border-top:1px solid var(--line);padding:12px 0}.series-row{display:grid;grid-template-columns:95px 1fr 75px;gap:10px}.result{display:grid;grid-template-columns:70px 1fr auto;gap:14px}.thumb{width:70px;height:98px;background:#e9eef8;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11px;overflow:hidden}.badge{display:inline-block;background:#eef2f7;border-radius:5px;padding:2px 6px;margin:4px 4px 0 0;font-size:11px}.modal{position:fixed;inset:0;background:#0b1526cc;display:none;z-index:5;padding:22px;overflow:auto}.modal.open{display:grid;place-items:center}.dialog{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:24px;position:relative}.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;font-size:22px}.detail{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail-image{aspect-ratio:5/7;background:#e9eef8;border-radius:10px;display:grid;place-items:center;overflow:hidden}.market-row{display:grid;grid-template-columns:100px 120px 1fr auto;gap:8px}.state{background:#f6f7f9;padding:9px;margin:7px 0;border-radius:7px}@media(max-width:760px){.cards,.sets{grid-template-columns:1fr 1fr}.catalog,.detail{grid-template-columns:1fr}.market-row{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards,.sets{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><header class="top"><div class="shell nav"><div class="logo">Card<b>Scope</b></div></div></header><main class="shell"><section class="hero"><div class="meta">TCG DATABASE & MARKET INTELLIGENCE</div><h1>從一個名字，找到每一個版本與市場價格</h1><p class="meta">搜尋多語卡名、卡號或系列；掛牌、買取、參考價與成交會分開標示。</p><div class="search"><input id="q" placeholder="夢幻、Mew、ミュウ、347/190、SV4a、OP-05…"><button id="go">搜尋</button></div><div class="filters" id="regions"><button class="pill active" data-v="all">全部</button><button class="pill" data-v="TW">台版</button><button class="pill" data-v="JP">日版</button><button class="pill" data-v="US">美版</button></div></section><div class="notice" id="notice"></div><section class="section"><h2>已收錄卡片</h2><p class="meta">此區不是熱門榜；在有真實活動資料前，不顯示假排名或假交易量。</p><div class="cards" id="cards"></div></section><section class="section"><h2>最新系列</h2><div class="sets" id="sets"></div></section><section class="section"><h2>卡片資料庫</h2><div class="catalog"><aside class="panel game-list" id="games"></aside><div class="panel"><h3 id="catalogTitle"></h3><div id="series"></div></div></div></section><p class="meta" id="status">Catalog 載入中；沒有可靠資料時不以示範數字代替。</p></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="detail"></div></div></div><script>
let C={games:[],series:[],cards:[]},region='all',game='pokemon';const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),n=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/[\s・·._:-]/g,''),S=id=>C.series.find(x=>x.id===id)||{},G=id=>C.games.find(x=>x.id===id)||{},rn=r=>({TW:'台版',JP:'日版',US:'美版'}[r]||r||'版本待補'),art=c=>c.imageUrl?`<img src="${e(c.imageUrl)}" alt="${e(c.nameZh||c.nameEn)}">`:`${e(c.nameEn||c.nameZh)}<br>${e(c.officialCardNumber)}`;
function searchable(c){let s=S(c.seriesId);return[c.nameZh,c.nameJa,c.nameEn,c.officialCardNumber,...(c.aliases||[]),s.officialCode,s.nameZh,s.nameJa,s.nameEn,...(s.aliases||[])].map(n)}function matches(q){return C.cards.filter(c=>(region==='all'||c.region===region||c.printings?.some(p=>p.region===region))&&searchable(c).some(x=>x.includes(n(q))))}
function rows(a){return a.map(c=>`<div class="result" onclick="openCard('${e(c.id)}')"><div class="thumb">${art(c)}</div><div><b>${e(c.nameZh||'—')} · ${e(c.nameEn||'—')}</b><div class="meta">${e(G(c.game).nameZh)} · ${e(S(c.seriesId).officialCode)} · ${e(c.officialCardNumber)}</div><span class="badge">${e(rn(c.region))}</span><span class="badge">${e(c.rarity||'稀有度待補')}</span></div><b>詳細與行情 →</b></div>`).join('')}
async function search(){let q=document.getElementById('q').value.trim(),box=document.getElementById('notice');if(!q)return;box.style.display='block';let a=matches(q);if(a.length){box.innerHTML=`<b>找到 ${a.length} 張</b>${rows(a)}`;return}box.textContent='正在查詢免費外部遊戲王圖鑑…';try{let r=await fetch(`/api/providers/ygoprodeck/search?q=${encodeURIComponent(q)}`),b=await r.json();if(r.ok&&b.data?.length){box.innerHTML=`<b>Catalog 尚未收錄，找到 ${b.data.length} 筆 YGOPRODeck 結果</b><p class="meta">價格為跨版本最低參考價，不是指定版本成交價；圖片不直接長期 hotlink。</p>${b.data.map(c=>`<div class="result"><div class="thumb">Yu-Gi-Oh!</div><div><b>${e(c.name)}</b><div class="meta">${e(c.sets?.[0]?.setCode||'版本待選')}</div></div><span>參考資料</span></div>`).join('')}`;return}}catch{}box.innerHTML=`找不到「<b>${e(q)}</b>」`}
async function openCard(id){let modal=document.getElementById('modal'),d=document.getElementById('detail');modal.classList.add('open');d.textContent='正在載入卡片與來源行情…';try{let[cr,mr]=await Promise.all([fetch(`/api/cards/${encodeURIComponent(id)}`),fetch(`/api/cards/${encodeURIComponent(id)}/market`)]),cb=await cr.json(),mb=await mr.json();if(!cr.ok)throw Error(cb.error);let c=cb.data,m=mb.data||{records:[],sources:[],meta:{}},labels=m.meta?.priceTypes||{};d.innerHTML=`<div class="detail"><div class="detail-image">${art(c)}</div><div><h2>${e(c.nameZh||c.nameEn)}</h2><p class="meta">${e(c.nameJa||'')} · ${e(c.nameEn||'')}</p><p>${e(c.game?.nameZh)}｜${e(c.series?.officialCode)}｜${e(c.officialCardNumber)}｜${e(c.rarity||'稀有度待補')}</p><h3>市場資料</h3><p class="meta">${e(m.meta?.warning)}</p>${m.records.length?m.records.map(r=>`<div class="market-row"><b>${e(r.provider)}</b><span class="badge">${e(labels[r.priceType]||r.priceType)}</span><span>${e(r.currency)} ${Number(r.amount).toLocaleString()}</span><b>${r.priceTwd==null?'未換算':'約 NT$ '+Number(r.priceTwd).toLocaleString()}</b></div>`).join(''):'<div class="state">目前沒有能可靠對應此版本的價格；不以假價格補空白。</div>'}<h3>來源狀態</h3>${m.sources.map(s=>`<div class="state"><b>${e(s.source)}</b>：${s.status==='ok'?'已查詢':'目前不可用'}${s.notice?' · '+e(s.notice):''}</div>`).join('')||'<div class="state">沒有已設定的來源。</div>'}</div></div>`}catch(x){d.textContent='載入失敗：'+x.message}}window.openCard=openCard;
function render(){document.getElementById('cards').innerHTML=C.cards.slice(0,6).map(c=>`<article class="tile" onclick="openCard('${e(c.id)}')"><div class="art">${art(c)}</div><h3>${e(c.nameZh)} · ${e(c.nameEn)}</h3><p class="meta">${e(c.officialCardNumber)} · ${e(rn(c.region))}</p></article>`).join('');document.getElementById('sets').innerHTML=[...C.series].sort((a,b)=>String(b.releaseDate).localeCompare(String(a.releaseDate))).slice(0,3).map(s=>`<article class="set-card" onclick="openSeries('${e(s.id)}')"><b>${e(s.officialCode)}</b><h3>${e(s.nameZh||s.nameEn)}</h3><p class="meta">${e(s.releaseDate||'發售日待補')}</p></article>`).join('');document.getElementById('games').innerHTML=C.games.map(g=>`<button class="${g.id===game?'active':''}" onclick="chooseGame('${e(g.id)}')">${e(g.nameZh)} ${e(g.nameEn)}</button>`).join('');document.getElementById('catalogTitle').textContent=(G(game).nameZh||'')+' · 系列索引';document.getElementById('series').innerHTML=C.series.filter(s=>s.game===game).map(s=>`<div class="series-row" onclick="openSeries('${e(s.id)}')"><b>${e(s.officialCode)}</b><span>${e(s.nameZh||s.nameEn)}<br><span class="meta">${e(s.nameJa||s.nameEn)}</span></span><span>${C.cards.filter(c=>c.seriesId===s.id).length} 張 →</span></div>`).join('')||'<p class="meta">尚無系列資料。</p>'}window.chooseGame=id=>{game=id;render()};window.openSeries=id=>{document.getElementById('q').value=S(id).officialCode;search();scrollTo({top:140,behavior:'smooth'})};
async function init(){try{let r=await fetch('/api/catalog',{cache:'no-store'}),b=await r.json();C=b.data;document.getElementById('status').textContent=`Catalog 來源：${C.source==='supabase'?'Supabase':'catalog.json 備援'}；${C.cards.length} 張卡、${C.series.length} 個系列。沒有可靠資料時不以示範數字代替。`;render()}catch{document.getElementById('status').textContent='Catalog 載入失敗。'}}document.getElementById('go').onclick=search;document.getElementById('q').onkeydown=x=>{if(x.key==='Enter')search()};document.querySelectorAll('#regions button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#regions button').forEach(x=>x.classList.remove('active'));b.classList.add('active');region=b.dataset.v;search()});document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=x=>{if(x.target.id==='modal')x.currentTarget.classList.remove('open')};init();
</script></body></html>
