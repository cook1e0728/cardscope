sor:pointer}.product-category.on{background:#111;color:#fff;border-color:#111}.series-card{min-width:190px;width:190px;cursor:pointer}.series-art{height:145px;border-radius:14px;background:var(--soft);overflow:hidden;display:grid;place-items:center;position:relative}.series-art.is-product{background:#fff;border:1px solid var(--line)}.image-fallback{display:grid;place-items:center;height:100%;padding:15px;text-align:center;color:var(--muted)}.series-card h3,.card h3{font-size:15px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;background:#eee;border-radius:5px;padding:2px 6px;font-size:11px;margin:3px 4px 0 0}.selected-product{display:none;grid-template-columns:180px 1fr;gap:24px;align-items:center;margin:8px 0 22px;padding:18px;border-radius:18px;background:linear-gradient(120deg,#fff7bf,#eefafa);border:1px solid var(--line)}.selected-product.open{display:grid}.selected-product-art{height:145px;background:#fff;border-radius:13px;overflow:hidden}.selected-product h2{margin:4px 0}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 14px}.card{cursor:pointer;min-width:0}.art{aspect-ratio:5/7;border-radius:12px;background:var(--soft);overflow:hidden;display:grid;place-items:center;text-align:center;padding:4px}.load-more{display:none;margin:24px auto 0;border:0;border-radius:999px;background:#111;color:#fff;padding:11px 25px;font-weight:800;cursor:pointer}.notice{display:none;margin:14px 0;padding:15px;border:1px solid #dfcf52;background:#fffde1;border-radius:12px}.status{margin:25px 0 95px;padding:13px 17px;background:var(--soft);border-radius:12px}.modal{position:fixed;inset:0;background:#111b;z-index:10;display:none;padding:24px;overflow:auto}.modal.open{display:grid;place-items:center}.dialog{max-width:920px;width:100%;background:#fff;border-radius:20px;padding:25px;position:relative}.close{position:absolute;right:14px;top:12px;border:0;width:36px;height:36px;border-radius:50%;font-size:22 <script>
const PRODUCT_CATEGORY_DEFINITIONS=[
  {id:'singles',label:'單卡',description:'可獨立查詢、收藏與比價的單張卡片。',values:['singles','單卡']},
  {id:'sealed',label:'密封商品',description:'未拆封的補充包、原盒、禮盒與組合包；不包含預組牌組。',values:['sealed','密封商品','原盒']},
  {id:'decks',label:'牌組／構築商品',description:'起始牌組、預組套牌、補充牌組與其他可直接遊玩的構築商品。',values:['decks','牌組／構築商品']},
  {id:'promo',label:'特典／贈品',description:'隨活動、商品或合作企劃發行的特典卡與配布品。',values:['promo','特典／贈品','特典卡']},
  {id:'event-store',label:'賽事／商店限定',description:'賽事獎品、參加獎、商店限定與店鋪活動配布。',values:['event-store','賽事／商店限定']},
  {id:'accessories',label:'周邊道具',description:'卡套、牌盒、收納用品與其他遊戲周邊。',values:['accessories','周邊道具']},
  {id:'other',label:'其他',description:'尚未能歸入上述類別的產品或資料。',values:['other','其他']}
];
const PRODUCT_CATEGORY_BY_ID=new Map(PRODUCT_CATEGORY_DEFINITIONS.map(category=>[category.id,category]));
const PRODUCT_CATEGORY_BY_VALUE=new Map(PRODUCT_CATEGORY_DEFINITIONS.flatMap(category=>category.values.map(value=>[value,category])));
const categoryDefinition=value=>PRODUCT_CATEGORY_BY_ID.get(value)||PRODUCT_CATEGORY_BY_VALUE.get(value);
const productCategoryLabel=value=>categoryDefinition(value)?.label||String(value||'分類待補');
const regionMatches=row=>{const region=typeof document==='undefined'?'all':document.getElementById('browseRegion')?.value||'all';return region==='all'||row.region===region||(row.printings||[]).some(p=>p.region===region)};
const productMatchesCategory=(product,categoryId)=>{const category=categoryDefinition(categoryId);return Boolean(category&&category.values.includes(String(product.catalogCategory||''))&&regionMatches(product))};
const productCategoryFilterValue=categoryId=>{const legacy={sealed:'原盒',promo:'特典卡',accessories:'周邊道具'}[categoryId];return legacy&&P.some(product=>product.catalogCategory===legacy)?legacy:categoryId};
let C={games:[],series:[],cards:[]},P=[],S=[],game='all',productCategory='原盒',productCategoryId='sealed',currentCardRows=[],verifiedPrices=new Map(),cardFilters={rarity:'all',price:'all',sort:'number-asc'},browse={rows:[],offset:0,seriesId:'',product:null,hasMore:false,loading:false};const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),G=id=>C.games.find(x=>x.id===id)||{},rn=r=>({TW:'台版',CN:'陸版',JP:'日版',US:'美版',KR:'韓版',ASIA:'亞洲英文版'}[r]||r||'版本待補'),ln=l=>String(l||'').startsWith('zh')?'繁體中文':String(l||'').startsWith('ja')?'日文':String(l||'').startsWith('ko')?'韓文':String(l||'').startsWith('en')?'英文':l||'語言待補',original=c=>c.nameJa||c.nameEn||c.nameKo||c.name||'',image=c=>c.imageUrl||c.printings?.find(p=>p.imageUrl&&!p.imageRehostRequired)?.imageUrl,name=c=>c.nameZh||`中文名稱待補｜${original(c)||'原名待補'}`,art=c=>image(c)?`<img src="${e(image(c))}" alt="${e(name(c))}" loading="lazy" onerror="this.remove()">`:e(name(c)),productArt=p=>p.imageUrl?`<img src="${e(p.imageUrl)}" alt="${e(name(p))}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="image-fallback unified-image-fallback" style="display:none"><b>圖片待補</b><small>圖片來源尚未收錄</small></span>`:'<span class="image-fallback unified-image-fallback"><b>圖片待補</b><small>圖片來源尚未收錄</small></span>';
function gameVisual(d){return d.id==='all'?'/assets/brand/cardscope-rabbit-mark.png':d.approvedLogoUrl||null}window.gameNavImage=id=>gameVisual((window.CARD_GAMES||[]).find(x=>x.id===id)||{id});
function channels(){let ds=window.CARD_GAMES||[{id:'all',name:'全部遊戲'},{id:'pokemon',name:'寶可夢'},{id:'onepiece',name:'航海王'},{id:'yugioh',name:'遊戲王'}];$('channels').innerHTML=ds.map(d=>{let visual=gameVisual(d);return`<button class="channel ${game===d.id?'on':''}" onclick="choose('${d.id}')"><div class="channel-art">${visual?`<img src="${e(visual)}" alt="${e(d.name)}的 CardScope 非官方分類圖" loading="lazy" onerror="this.remove()">`:`<span class="ip-wordmark">${e(d.shortName||d.name)}</span>`}<span class="channel-tag">${e(d.language||'多語')}</span></div><b>${e(d.name)}</b></button>`}).join('')}
function productCategories(){$('productCategories').innerHTML=PRODUCT_CATEGORY_DEFINITIONS.map(category=>{let count=P.filter(x=>(game==='all'||x.game===game)&&productMatchesCategory(x,category.id)).length;return`<button class="product-category ${productCategoryId===category.id?'on':''}" title="${e(category.description)}" aria-label="${e(category.label)}：${e(category.description)}" aria-pressed="${productCategoryId===category.id}" onclick="chooseProductCategory('${category.id}')">${e(category.label)}${category.id==='singles'?'':`（${count}）`}</button>`}).join('')}
function series(){let rows=P.filter(x=>(game==='all'||x.game===game)&&productMatchesCategory(x,productCategoryId)).sort((a,b)=>String(b.releaseDate||'').localeCompare(String(a.releaseDate||''))).slice(0,60);$('series').innerHTML=rows.length?rows.map(s=>`<article class="series-card" onclick="openProduct('${e(s.id)}')"><div class="series-art is-product">${productArt(s)}</div><h3>${e(name(s))}</h3><div class="meta">${e(s.productSubtype||s.productType||'類型待補')} · <span class="badge">${e(s.versionLabel||rn(s.region))}</span></div></article>`).join(''):`<p class="meta">這個 IP／版本的「${e(productCategoryLabel(productCategoryId))}」尚未完成可靠的實體商品圖索引；不以系列 Logo 或一般單卡灌入數量。</p>`}
const cardNumbers=c=>[c.officialCardNumber,...(c.printings||[]).map(p=>p.localCardNumber)].filter(Boolean),cardRarities=c=>[c.rarity,...(c.printings||[]).map(p=>p.rarity)].filter(Boolean),cardRelease=c=>(c.printings||[]).map(p=>p.releaseDate).filter(Boolean).sort().at(-1)||'',numberKey=c=>String(cardNumbers(c)[0]||'').toLocaleUpperCase(),priceFor=c=>c.game===game&&(c.region==='JP'||(c.printings||[]).some(p=>p.region==='JP'))?cardNumbers(c).map(n=>verifiedPrices.get(String(n).trim().toUpperCase())).find(Boolean)||null:null;
function refreshRarityOptions(rows){let select=$('rarityFilter'),value=cardFilters.rarity,values=[...new Set(rows.flatMap(cardRarities))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));select.innerHTML='<option value="all">全部稀有度</option>'+values.map(v=>`<option value="${e(v)}">${e(v)}</option>`).join('');select.value=values.includes(value)?value:'all';cardFilters.rarity=select.value}
function filteredCards(rows){let data=rows.filter(regionMatches).filter(c=>cardFilters.rarity==='all'||cardRarities(c).includes(cardFilters.rarity)).filter(c=>cardFilters.price==='all'||(cardFilters.price==='priced'?Boolean(priceFor(c)):!priceFor(c))),sort=cardFilters.sort;return [...data].sort((a,b)=>sort==='number-desc'?numberKey(b).localeCompare(numberKey(a),undefined,{numeric:true}):sort==='release-desc'?String(cardRelease(b)).localeCompare(String(cardRelease(a)))||numberKey(a).localeCompare(numberKey(b),undefined,{numeric:true}):sort==='price-asc'?(priceFor(a)?.price??Infinity)-(priceFor(b)?.price??Infinity):sort==='price-desc'?(priceFor(b)?.price??-Infinity)-(priceFor(a)?.price??-Infinity):numberKey(a).localeCompare(numberKey(b),undefined,{numeric:true}))}
function cards(rows,keepSource=false){if(!keepSource){currentCardRows=rows;refreshRarityOptions(rows)}let shown=filteredCards(currentCardRows);$('filterSummary').textContent=`目前載入 ${currentCardRows.length.toLocaleString()} 張，篩選後 ${shown.length.toLocaleString()} 張；價格僅採可驗證買取資料`;$('cards').innerHTML=shown.length?shown.map(c=>{let price=priceFor(c);return`<article class="card" onclick="openCard('${e(c.id)}')"><div class="art">${art(c)}</div><h3>${e(name(c))}</h3><div class="meta">${e(c.officialCardNumber||c.printings?.[0]?.localCardNumber)} · ${e(c.rarity||c.printings?.[0]?.rarity||'稀有度待補')}</div>${price?`<div class="card-price">${e(price.currency)} ${Number(price.price).toLocaleString()} 買取</div>`:''}<span class="badge">${e(rn(c.region||c.printings?.[0]?.region))}</span></article>`}).join(''):'<p>目前沒有符合條件的卡片；若是尚未發售商品，代表官方尚未公開卡表。</p>'}
async function loadVerifiedPrices(id){verifiedPrices.clear();if(id==='all'){cards(currentCardRows,true);return}try{let response=await fetch('/api/buyback-prices?game='+encodeURIComponent(id)),body=await response.json();if(game!==id)return;for(const row of body.data||[])verifiedPrices.set(String(row.cardNumber||'').trim().toUpperCase(),row)}catch{}cards(currentCardRows,true)}
function clearProduct(){browse={rows:[],offset:0,seriesId:'',product:null,hasMore:false,loading:false};$('selectedProduct').classList.remove('open')}
function render(){productCategory=productCategoryFilterValue(productCategoryId);channels();productCategories();series();if(game==='all'){clearProduct();cards(C.cards.slice(0,24));$('cardsTitle').textContent='最新卡片';$('cardsMeta').textContent='請選擇 IP 查看完整圖鑑'}else loadGameCards(game)}window.choose=async id=>{game=id;verifiedPrices.clear();clearProduct();render();await loadVerifiedPrices(id)};window.chooseProductCategory=category=>{const definition=categoryDefinition(category);if(!definition)return;productCategoryId=definition.id;productCategory=productCategoryFilterValue(definition.id);productCategories();series();if(definition.id==='singles')$('cardsTitle').scrollIntoView({behavior:'smooth',block:'start'})};window.seriesSearch=q=>{$('q').value=q;search()};window.marketInfo=()=>{let b=$('notice');b.style.display='block';b.textContent='市場資料在卡片詳細頁中顯示，買取、掛牌與參考價會分開標示。'};
async function loadCardsPage(reset=false){if(browse.loading||game==='all')return;const state=browse,selectedGame=game;state.loading=true;if(reset){state.rows=[];state.offset=0;cards([])}const button=$('loadMore');button.disabled=true;button.textContent='載入中…';try{let url=`/api/cards?game=${encodeURIComponent(selectedGame)}&limit=100&offset=${state.offset}`;if(state.seriesId)url+=`&series=${encodeURIComponent(state.seriesId)}`;let response=await fetch(url),body=await response.json();if(state!==browse||game!==selectedGame)return;if(!response.ok)throw Error(body.error||'載入失敗');state.rows.push(...(body.data||[]).filter(c=>c.game===selectedGame));state.offset+=100;state.hasMore=Boolean(body.meta?.hasMore);cards(state.rows);$('cardsTitle').textContent=state.product?name(state.product):`${G(game).nameZh||game}卡片圖鑑`;$('cardsMeta').textContent=`已載入 ${state.rows.length.toLocaleString()} 張；版本與稀有度篩選目前已載入資料`;button.style.display=state.hasMore?'block':'none'}catch(error){if(state===browse){let notice=$('notice');notice.style.display='block';notice.textContent='載入失敗：'+error.message}}finally{state.loading=false;if(state===browse){button.disabled=false;button.textContent='載入更多卡片'}}}
async function loadGameCards(id){if(game!==id)return;clearProduct();await loadCardsPage(true)}
async function openProduct(id){let p=P.find(x=>x.id===id);if(!p)return;if(game!==p.game){window.choose(p.game)}clearProduct();browse.product=p;browse.seriesId=p.seriesId||'';let box=$('selectedProduct');box.classList.add('open');box.innerHTML=`<div class="selected-product-art">${productArt(p)}</div><div><span class="badge">${e(productCategoryLabel(p.catalogCategory))}</span><span class="badge">${e(p.versionLabel||rn(p.region))}</span><h2>${e(name(p))}</h2><div class="meta">${e(p.officialCode||'商品代碼待補')} · ${e(p.releaseDate||'發售日待補')} · ${e(p.productSubtype||p.productType||'類型待補')}</div>${p.metadata?.status==='upcoming'?'<p><b>即將發售；官方卡表尚未公開。</b></p>':''}${p.sourceUrl?`<a class="source-link" href="${e(p.sourceUrl)}" target="_blank" rel="noopener">查看官方商品頁</a>`:''}</div>`;if(p.seriesId){await loadCardsPage(true)}else{cards([]);$('cardsTitle').textContent=name(p);$('cardsMeta').textContent='此商品尚無可靠的收錄卡表對應；請參考官方商品頁。';$('loadMore').style.display='none'}box.scrollIntoView({behavior:'smooth',block:'center'})}window.openProduct=openProduct;
async function search(){let q=$('q').value.trim(),b=$('notice');if(!q)return;clearProduct();$('loadMore').style.display='none';b.style.display='block';b.textContent='正在搜尋完整圖鑑…';try{let r=await fetch('/api/search?q='+encodeURIComponent(q)+'&region='+encodeURIComponent($('browseRegion').value)),x=await r.json();if(!r.ok)throw Error(x.error);cards(x.data||[]);$('cardsTitle').textContent=`「${q}」的搜尋結果（${x.data?.length||0}）`;b.textContent=x.data?.length?'卡圖語言不影響繁中主名稱；不同版本會合併整理。':'找不到結果；不以示範卡片填補。';$('cards').scrollIntoView({behavior:'smooth'})}catch(x){b.textContent='搜尋失敗：'+x.message}}
async function openCard(id){$('modal').classList.add('open');$('detail').textContent='正在載入…';try{let[cr,mr]=await Promise.all([fetch('/api/cards/'+encodeURIComponent(id)),fetch('/api/cards/'+encodeURIComponent(id)+'/market')]),cb=await cr.json(),mb=await mr.json(),c=cb.data,m=mb.data||{records:[],meta:{}};if(!cr.ok)throw Error(cb.error);let ps=c.printings||[],ref=ps.find(p=>p.region==='JP')||ps.find(p=>p.region==='TW')||ps.find(p=>p.region==='US')||ps.find(p=>p.region==='KR')||ps[0],versions=ps.map(p=>{let diff=[];if(ref&&p!==ref&&p.localCardNumber&&p.localCardNumber!==ref.localCardNumber)diff.push('卡號不同');if(ref&&p!==ref&&p.rarity&&ref.rarity&&p.rarity!==ref.rarity)diff.push('稀有度不同');return`<div class="state"><b>${e(rn(p.region))}</b>${p===ref?' · <span class="badge">比對基準</span>':''} · ${e(ln(p.language))} · ${e(p.localSetCode)} · ${e(p.localCardNumber)}${diff.length?`<br><span class="meta">版本差異：${e(diff.join('、'))}</span>`:''}</div>`}).join('');$('detail').innerHTML=`<div class="detail"><div class="detail-art">${art(c)}</div><div><h2>${e(name(c))}</h2><p class="meta">${original(c)?'原名：'+e(original(c)):''}</p><p>${e(c.game?.nameZh)}｜${e(c.officialCardNumber)}｜${e(c.rarity||'稀有度待補')}</p><h3>收錄版本</h3><p class="meta">優先以日版作跨地區比對基準；缺少日版時依序採台版、美版、韓版或其他版本。</p>${versions||'<div class="state">版本待補</div>'}<h3>市場資料</h3><p class="meta">${e(m.meta?.warning||'不同價格性質不混算。')}</p>${m.records?.length?m.records.map(r=>`<div class="market"><b>${e(r.provider)}</b> · ${e(r.priceType)} · ${e(r.currency)} ${Number(r.amount).toLocaleString()}</div>`).join(''):'<div class="state">目前沒有可靠對應價格，不以假價格補空白。</div>'}</div></div>`}catch(x){$('detail').textContent='載入失敗：'+x.message}}window.openCard=openCard;
async function init(){const get=async url=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('資料來源暫時無法回應');return response.json()};let coverage=null;const updateStatus=()=>{$('status').textContent=`${C.source==='catalog.json'?'本機備援資料':'資料庫收錄'}：${Number(coverage?.totalCards||C.cards.length).toLocaleString()} 張卡片；${P.length.toLocaleString()} 筆實體商品。分類與圖片來源持續核對中。`};channels();productCategories();const catalogTask=get('/api/catalog').then(body=>{C=body.data;render();updateStatus()}).catch(error=>{$('status').textContent='卡片資料載入失敗：'+error.message});const productTask=get('/api/products').then(body=>{P=body.data||[];S=body.series||[];productCategory=productCategoryFilterValue(productCategoryId);productCategories();series();updateStatus()}).catch(()=>{$('series').innerHTML='<p class="meta">商品來源暫時無法回應，仍可使用卡片搜尋。</p>'});get('/api/catalog/coverage').then(body=>{coverage=body.data;updateStatus()}).catch(()=>{});await Promise.allSettled([catalogTask,productTask])}$('browseRegion').onchange=()=>{productCategories();series();if(game==='all')cards(currentCardRows,true);else loadGameCards(game)};$('go').onclick=search;$('q').onkeydown=x=>{if(x.key==='Enter')search()};$('loadMore').onclick=()=>loadCardsPage(false);$('rarityFilter').onchange=x=>{cardFilters.rarity=x.target.value;cards(currentCardRows,true)};$('priceFilter').onchange=x=>{cardFilters.price=x.target.value;cards(currentCardRows,true)};$('cardSort').onchange=x=>{cardFilters.sort=x.target.value;cards(currentCardRows,true)};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=x=>{if(x.target.id==='modal')$('modal').classList.remove('open')};init();
</script><script src="/game-switcher.js"></script><script src="/series-navigator.js"></script><script src="/ui-enhancements.js"></script></body></html>
